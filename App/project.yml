# XcodeGen spec for the real macOS app target.
#
# The lead runs `xcodegen generate` from this App/ directory to produce
# DwanimIt.xcodeproj, then `xcodebuild`. This file only DESCRIBES the project;
# it is the single source of truth for the target, its settings, and the local
# SkinKit package wiring.
#
# Locked decisions baked in here:
#   - bundle id app.dwanim.dwanimit, display name dwanim it, min macOS 14.0
#   - sandbox via the CODE_SIGN_ENTITLEMENTS file (3 keys; no network)
#   - .wsz is NOT a document type (no CFBundleDocumentTypes / no UTI)

name: DwanimIt

options:
  # Match the SkinKit package platform tier.
  deploymentTarget:
    macOS: "14.0"
  # Keep generated-project noise out of the diff-able spec.
  createIntermediateGroups: true
  # LOCALIZATION FOUNDATION (l10n step). Sets the project's development
  # (source) language to English.
  developmentLanguage: en

# LOCALIZATION FOUNDATION (l10n step). The project's `knownRegions` is NOT set
# by a literal spec key — XcodeGen 2.45.4 has no `knownRegions` input and
# silently ignores one. XcodeGen instead DERIVES knownRegions from the locales
# declared in localized resources it discovers, plus `Base` and the
# development language. The app-level String Catalog at
# DwanimIt/Resources/Localizable.xcstrings declares en + ja + zh-Hant, so the
# regenerated project emits `knownRegions = (Base, en, ja, zh-Hant)`. Add a new
# target locale by adding it to that catalog (and the package catalogs), not
# here.

# The local SkinKit SwiftPM package (one directory up from App/).
packages:
  SkinKit:
    path: ../SkinKit

targets:
  DwanimIt:
    type: application
    platform: macOS
    deploymentTarget: "14.0"

    # The app's own Swift sources (DwanimItApp.swift) and the asset catalog
    # (which carries the AppIcon set that CFBundleIconName references).
    #
    # The whole DwanimIt folder is taken as sources, then the Resources files
    # that must NOT be copied as loose bundle resources are excluded:
    #   - Info.plist            -> consumed via INFOPLIST_FILE
    #   - DwanimIt.entitlements   -> consumed via CODE_SIGN_ENTITLEMENTS
    #   - AppIcon.icns          -> a standalone artifact from increment #3;
    #                              the bundle icon comes from the asset catalog,
    #                              so the loose .icns would be redundant bloat.
    sources:
      - path: DwanimIt
        excludes:
          - "Resources/Info.plist"
          - "Resources/DwanimIt.entitlements"
          - "Resources/AppIcon.icns"

    # Library products the app links from the local SkinKit package. DwanimItUI +
    # PlaybackKit + PlayerCore are what the seed (DwanimItApp.swift) imports today;
    # the rest are the products the full shell (#6) will pull in (classic-skin
    # rendering / windows), declared now so the link graph is complete.
    dependencies:
      - package: SkinKit
        product: DwanimItUI
      - package: SkinKit
        product: SkinAppKit
      - package: SkinKit
        product: PlayerCore
      - package: SkinKit
        product: PlaybackKit
      - package: SkinKit
        product: SkinKitImageIO
      - package: SkinKit
        product: SkinKit
      - package: SkinKit
        product: SkinRender
      - package: SkinKit
        product: PlayerControl
      - package: SkinKit
        product: SpectrumKit

    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.dwanim.dwanimit
        # We author Info.plist by hand; do not let Xcode synthesize one.
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: DwanimIt/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: DwanimIt/Resources/DwanimIt.entitlements
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        # STRICT CONCURRENCY (M5 hardening): match the SkinKit package's
        # `-strict-concurrency=complete`. The app target uses the SEPARATE Xcode
        # build system, so the package's per-target Swift flag does NOT propagate
        # here — this key is the app-side equivalent. SWIFT_VERSION stays 5.0, so
        # (like the package) diagnostics surface as warnings, not hard errors;
        # graduating to SWIFT_VERSION 6.0 is the same deliberate follow-up.
        SWIFT_STRICT_CONCURRENCY: complete
        # HARDENED RUNTIME (M5 ship-prep): required for Developer-ID / notarized
        # direct distribution, and harmless for the Mac App Store path. Set in
        # `base` so both Debug and Release archives carry it consistently — the
        # App Sandbox already constrains the process, and hardened runtime adds
        # no get-task-allow of its own (Xcode injects get-task-allow only for
        # Debug ad-hoc signing, and strips it from Release archives).
        ENABLE_HARDENED_RUNTIME: YES
        # SIGNING IDENTITY: the Apple Developer Team ID is now baked in. It is
        # NOT a secret -- the 10-character team id is embedded in every shipped
        # binary and readable from any distributed copy -- so committing it keeps
        # the archive/export step reproducible instead of relying on per-machine
        # overrides. CODE_SIGN_IDENTITY is still left unset so Xcode's automatic
        # signing picks the right certificate per configuration ("Apple
        # Development" for Debug, "Apple Distribution" / "3rd Party Mac
        # Developer Application" for a Mac App Store archive). A clone without
        # this team's certificates can still build unsigned with
        # CODE_SIGNING_ALLOWED=NO. See md_files/SHIPPING.md.
        DEVELOPMENT_TEAM: 7GRD9Y5U7W
        CODE_SIGN_STYLE: Automatic

# A SHARED scheme so `xcodebuild -scheme DwanimIt` works for any clone / CI
# without relying on Xcode's per-user autocreated schemes (which are gitignored).
schemes:
  DwanimIt:
    build:
      targets:
        DwanimIt: all
    run:
      config: Debug
    archive:
      config: Release
